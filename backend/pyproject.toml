[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caloai-backend"
version = "0.1.0"
description = "FastAPI backend for CaloAI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "Pillow>=10.4,<12.0",
  "google-auth>=2.35,<3.0",
  "requests>=2.32,<3.0",
  "PyJWT[crypto]>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
