name: calo_ai
description: AI-powered calorie tracker with food photo recognition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Image
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  flutter_image_compress: ^2.5.1

  # Network
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: 0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.3
  health: 13.3.1
  permission_handler: ^12.0.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
