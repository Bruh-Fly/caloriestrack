name: calo_ai
description: AI-powered calorie tracker with food photo recognition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Image
  image_picker: ^1.1.2

  # Network
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: 0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
